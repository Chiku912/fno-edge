<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FNO Edge</title>
<style>
    body { font-family: sans-serif; background: #f0f6ff; margin: 0; padding-bottom: 70px; }
    .tab { display: none; padding: 15px; }
    .active { display: block; }
    .nc { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .nav { position: fixed; bottom: 0; width: 100%; display: flex; background: white; border-top: 1px solid #ddd; }
    .nav-btn { flex: 1; text-align: center; padding: 15px; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
    <div id="tab-signals" class="tab active"><div id="sig-list">Loading alerts...</div></div>
    <div id="tab-calendar" class="tab"><div id="cal-list">Loading calendar...</div></div>
    
    <div class="nav">
        <div class="nav-btn" onclick="openTab('tab-signals')">🔔 Alerts</div>
        <div class="nav-btn" onclick="openTab('tab-calendar')">📅 Calendar</div>
    </div>

<script>
const API_URL = 'https://fno-edge.onrender.com';

function openTab(id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

async function fetchData() {
    try {
        const res = await fetch(API_URL + '/api/signals');
        const json = await res.json();
        document.getElementById('sig-list').innerHTML = json.data.map(item => 
            `<div class="nc"><b>${(item.SLONGNAME||'').split(' ')[0]}</b><br>${item.HEADLINE||'No details'}</div>`
        ).join('');
    } catch(e) { document.getElementById('sig-list').innerHTML = "Engine offline. Check Render logs."; }
}

fetchData();
</script>
</body>
</html>
