<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>FNO Edge — Pro Terminal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#F8FAFC;color:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;overflow:hidden}
.app{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
.hdr{background:#1E3A8A;color:#fff;padding:12px 16px;font-size:15px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.live-dot{width:7px;height:7px;background:#22C55E;border-radius:50%;display:inline-block;box-shadow:0 0 6px #22C55E;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:0.4}100%{opacity:1}}
.content{flex:1;overflow-y:auto;padding:10px;padding-bottom:80px}
.tab{display:none}
.tab.active{display:block}
.card{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px;border-left:4px solid #64748B;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.card.critical{border-left-color:#DC2626}
.card.medium{border-left-color:#D97706}
.card.general{border-left-color:#2563EB}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sym-group{display:flex;gap:6px;align-items:center}
.sym{font-size:11px;font-weight:900;color:#1D4ED8;text-transform:uppercase}
.badge{font-size:8px;font-weight:700;padding:2px 5px;border-radius:3px}
.badge-fno{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
.badge-crit{background:#FEF2F2;color:#DC2626;border:1px solid #FCA5A5}
.badge-med{background:#FFFBEB;color:#D97706;border:1px solid #FDE68A}
.badge-gen{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0}
.timestamp{font-size:9px;color:#64748B;font-weight:500}
.cat{font-size:10px;font-weight:700;color:#475569;margin-bottom:2px}
.title{font-size:11px;font-weight:600;color:#0F172A;margin-bottom:8px;line-height:1.35}
.meta-bar{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.btn{font-size:8px;font-weight:700;padding:3px 6px;border-radius:4px;text-decoration:none;cursor:pointer;border:none}
.pdf-btn{background:#FFF5F5;color:#DC2626;border:1px solid #FCA5A5}
.ai-btn{background:#E8F5E9;color:#059669;border:1px solid #A5D6A7}
.gcal-btn{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
.ai-box{background:#F0FDF4;border:1px solid #BBF7D0;padding:6px;border-radius:4px;font-size:9px;color:#166534;margin-top:6px;display:none}
.filters{display:flex;gap:5px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px}
.chip{font-size:9px;font-weight:600;padding:3px 8px;border-radius:10px;background:#fff;border:1px solid #CBD5E1;color:#64748B;cursor:pointer;white-space:nowrap}
.chip.active{background:#EFF6FF;color:#2563EB;border-color:#2563EB}
.srch{width:100%;padding:7px 10px;border:1px solid #CBD5E1;border-radius:6px;font-size:11px;margin-bottom:8px;outline:none}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:#fff;border-top:1px solid #E2E8F0;display:flex;z-index:100}
.nav-item{flex:1;text-align:center;padding:10px 0 12px 0;font-size:10px;font-weight:600;color:#64748B;cursor:pointer}
.nav-item.active{color:#2563EB}
.empty{text-align:center;color:#94A3B8;padding:30px 0;font-size:11px}
</style>
</head>
<body>

<div class="app">
  <div class="hdr">
    <span>FNO EDGE <span style="font-size: 10px; font-weight: 400; color: #93C5FD;">| F&O ONLY</span></span>
    <span style="font-size:9px;font-weight:500"><span class="live-dot"></span> Sync Active</span>
  </div>

  <div class="content">
    <!-- TAB 1: ALERTS -->
    <div id="tab-alerts" class="tab active">
      <div class="filters">
        <div class="chip active" onclick="setFilter('ALL', this)">All F&O</div>
        <div class="chip" onclick="setFilter('CRIT', this)">⚡ Critical Impact</div>
      </div>
      <div id="alerts-list"><div class="empty">Loading F&O announcements feed...</div></div>
    </div>

    <!-- TAB 2: HISTORY -->
    <div id="tab-history" class="tab">
      <input type="text" class="srch" id="hist-search" placeholder="Search archive..." oninput="renderHistory()"/>
      <div id="history-list"><div class="empty">No history archived.</div></div>
    </div>

    <!-- TAB 3: CALENDAR -->
    <div id="tab-calendar" class="tab">
      <div style="font-size:10px;font-weight:700;color:#64748B;margin-bottom:6px">F&O CORPORATE ACTIONS</div>
      <div id="calendar-list"><div class="empty">Loading calendar...</div></div>
    </div>
  </div>

  <div class="nav">
    <div class="nav-item active" onclick="switchTab('tab-alerts', this)">🔔 Alerts</div>
    <div class="nav-item" onclick="switchTab('tab-history', this)">📁 History</div>
    <div class="nav-item" onclick="switchTab('tab-calendar', this)">📅 Calendar</div>
  </div>
</div>

<script>
const BACKEND_URL = 'https://fno-edge.onrender.com';
let allSignals = [];
let currentFilter = 'ALL';

function switchTab(tabId, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    el.classList.add('active');
    if(tabId === 'tab-history') renderHistory();
    if(tabId === 'tab-calendar') loadCalendar();
}

function setFilter(val, el) {
    currentFilter = val;
    el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    renderAlerts();
}

async function loadAlerts() {
    try {
        const res = await fetch(BACKEND_URL + '/api/signals');
        const json = await res.json();
        allSignals = (json.data || []).map((item, idx) => {
            const sym = (item.symbol || 'MARKET').toUpperCase();
            const priority = (item.priority || 'GENERAL').toUpperCase();
            const cat = item.category || 'Corporate Disclosure';
            const title = item.subject || 'Details unavailable';
            const dt = item.date || 'Just now';
            const pdf = item.attachement || null;

            return { id: item.id || idx, sym: sym, priority: priority, category: cat, title: title, dt: dt, pdf: pdf };
        });
        localStorage.setItem('fnoe_pro_history', JSON.stringify(allSignals));
        renderAlerts();
    } catch(e) {
        document.getElementById('alerts-list').innerHTML = `<div class="empty">Connection error with backend engine.</div>`;
    }
}

function renderAlerts() {
    const filtered = allSignals.filter(s => {
        if(currentFilter === 'CRIT' && s.priority !== 'CRITICAL') return false;
        return true;
    });

    const el = document.getElementById('alerts-list');
    if(filtered.length === 0) { el.innerHTML = `<div class="empty">No matching F&O records found.</div>`; return; }
    el.innerHTML = filtered.map(s => buildCard(s)).join('');
}

function buildCard(s) {
    const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(s.sym + ': ' + s.title)}`;
    const aiSummary = getAiAnalysis(s.title);
    
    let prioClass = 'general';
    let prioBadge = '<span class="badge badge-gen">GENERAL</span>';
    if(s.priority === 'CRITICAL') { prioClass = 'critical'; prioBadge = '<span class="badge badge-crit">CRITICAL</span>'; }
    else if(s.priority === 'MEDIUM') { prioClass = 'medium'; prioBadge = '<span class="badge badge-med">MEDIUM</span>'; }

    return `
        <div class="card ${prioClass}">
            <div class="top-row">
                <div class="sym-group">
                    <span class="sym">${s.sym}</span>
                    <span class="badge badge-fno">F&O</span>
                    ${prioBadge}
                </div>
                <span class="timestamp">${s.dt}</span>
            </div>
            <div class="cat">📁 ${s.category}</div>
            <div class="title">${s.title}</div>
            <div class="meta-bar">
                ${s.pdf ? `<a class="btn pdf-btn" href="${s.pdf}" target="_blank">📄 PDF</a>` : ''}
                <button class="btn ai-btn" onclick="toggleAi('${s.id}')">🤖 AI Breakdown</button>
                <a class="btn gcal-btn" href="${gcalUrl}" target="_blank">📅 + Add Task</a>
            </div>
            <div id="ai-res-${s.id}" class="ai-box"><b>Strategic Insight:</b> ${aiSummary}</div>
        </div>
    `;
}

function getAiAnalysis(title) {
    const t = title.toLowerCase();
    if(t.includes('dividend')) return "💰 Cash Flow Yield: Expect upward adjustment in option premiums near ex-date.";
    if(t.includes('result') || t.includes('earnings')) return "📊 Volatility Alert: High Implied Volatility (IV) expected; review option straddles.";
    if(t.includes('buyback')) return "📈 Capital Allocation: Bullish indicator signaling management valuation support.";
    if(t.includes('contract') || t.includes('order')) return "🚀 Revenue Catalyst: Significant order book expansion supporting medium-term momentum.";
    return "📰 Corporate Filing: Monitor delivery volume concentration and open interest shifts.";
}

function toggleAi(id) {
    const box = document.getElementById(`ai-res-${id}`);
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

function renderHistory() {
    const cached = JSON.parse(localStorage.getItem('fnoe_pro_history') || '[]');
    const q = (document.getElementById('hist-search').value || '').toLowerCase();
    const filtered = cached.filter(h => !q || h.sym.toLowerCase().includes(q) || h.title.toLowerCase().includes(q));
    const el = document.getElementById('history-list');
    if(filtered.length === 0) { el.innerHTML = `<div class="empty">No matching archive records.</div>`; return; }
    el.innerHTML = filtered.map(h => buildCard(h)).join('');
}

async function loadCalendar() {
    try {
        const res = await fetch(BACKEND_URL + '/api/calendar');
        const json = await res.json();
        const calList = document.getElementById('calendar-list');
        const items = json.data || [];
        if(items.length === 0) { calList.innerHTML = `<div class="empty">No F&O corporate action events found.</div>`; return; }

        calList.innerHTML = items.map(c => `
            <div class="card critical" style="border-left-color:#2563EB">
                <div class="top-row">
                    <span class="sym">${c.symbol || 'CORP'}</span>
                    <span class="timestamp">Ex-Date: ${c.exDate || 'Upcoming'}</span>
                </div>
                <div class="title">${c.purpose || 'Corporate Action'}</div>
            </div>
        `).join('');
    } catch(e) {
        document.getElementById('calendar-list').innerHTML = `<div class="empty">Failed to load calendar.</div>`;
    }
}

loadAlerts();
setInterval(loadAlerts, 30000); // Live background polling every 30 seconds
</script>
</body>
</html>
